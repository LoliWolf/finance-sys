[project]
name = "finance-sys-agent"
version = "0.1.0"
description = "M4 Python agent sidecar for document instrument resolution."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<0.28",
    "langgraph>=0.2,<0.3",
    "pydantic>=2.7,<3",
    "uvicorn[standard]>=0.30,<0.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
